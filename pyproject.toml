readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "defusedxml>=0.7.1,<1",
  "lxml>=5.3,<7",
  "markitdown[pptx]>=0.1.3,<1",
  "pillow>=11,<13",
  "pymupdf>=1.25,<2",
  "python-pptx>=1.0.2,<2",
]

[tool.uv]
package = false
